name: Update GitHub activity tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/build_tracker.py"
      - ".github/workflows/update-tracker.yml"

permissions:
  contents: write

concurrency:
  group: profile-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate tracker from GitHub activity
        env:
          GH_USER: Jaumns
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_tracker.py
      - name: Commit updated tracker
        run: |
          if git diff --quiet -- img/tracker.svg; then
            echo "Tracker is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/tracker.svg
          git commit -m "chore: refresh GitHub activity tracker"
          git push
