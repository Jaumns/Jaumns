<svg xmlns="http://www.w3.org/2000/svg" width="830" height="210" viewBox="0 0 830 210" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs></defs><rect width="830" height="210" fill="#0b0709"/><rect width="830" height="210" fill="#ff2e4d" fill-opacity=".03"/><rect width="2" height="210" fill="#ff2e4d"/><circle cx="32" cy="29" r="12" fill="#ff2e4d" fill-opacity=".14" stroke="#ff2e4d" stroke-opacity=".6"/><text x="32" y="33.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ff2e4d">1</text><text x="56" y="34" font-size="14.5" fill="#f5f2f3">Land a position as Game Director, Narrative Director or Producer</text><circle cx="32" cy="65" r="12" fill="#ff2e4d" fill-opacity=".14" stroke="#ff2e4d" stroke-opacity=".6"/><text x="32" y="69.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ff2e4d">2</text><text x="56" y="70" font-size="14.5" fill="#f5f2f3">Build consistent, well-structured projects</text><circle cx="32" cy="101" r="12" fill="#ff2e4d" fill-opacity=".14" stroke="#ff2e4d" stroke-opacity=".6"/><text x="32" y="105.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ff2e4d">3</text><text x="56" y="106" font-size="14.5" fill="#f5f2f3">Expand backend knowledge with APIs and security</text><circle cx="32" cy="137" r="12" fill="#ff2e4d" fill-opacity=".14" stroke="#ff2e4d" stroke-opacity=".6"/><text x="32" y="141.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ff2e4d">4</text><text x="56" y="142" font-size="14.5" fill="#f5f2f3">Contribute to open source software and technical communities</text><circle cx="32" cy="173" r="12" fill="#ff2e4d" fill-opacity=".14" stroke="#ff2e4d" stroke-opacity=".6"/><text x="32" y="177.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ff2e4d">5</text><text x="56" y="178" font-size="14.5" fill="#f5f2f3">Keep building high-quality tools and mods for PC games</text><g id="glass-panel" pointer-events="none"><rect x="1" y="1" width="828