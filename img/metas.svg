<svg xmlns="http://www.w3.org/2000/svg" width="830" height="330" viewBox="0 0 830 330" role="img" aria-label="Current goals">
<rect width="830" height="330" fill="#0b0709"/>
<rect x=".5" y=".5" width="829" height="329" fill="none" stroke="#2e1519"/>
<path d="M0 0H830" stroke="#ff2e4d" stroke-width="3"/>
<g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<text x="28" y="42" fill="#ff2e4d" font-size="11" font-weight="700" letter-spacing="2">GOALS / CURRENT PRIORITIES</text>
<text x="28" y="82" fill="#f5f2f3" font-size="24" font-weight="700">Build useful things. Make them last.</text>
<text x="28" y="112" fill="#9a969b" font-size="13">Strengthen my engineering skills through well-structured software, deeper backend</text>
<text x="28" y="132" fill="#9a969b" font-size="13">and security knowledge, and practical tools shared with the communities around them.</text>
<line x1="28" y1="160" x2="802" y2="160" stroke="#2e1519"/>
<text x="28" y="190" fill="#ff9a8b" font-size="11" font-weight="700" letter-spacing="1">CURRENT GOALS</text>
<g font-size="14" fill="#f5f2f3">
<text x="28" y="222" fill="#ff9a8b" font-size="11" font-weight="700">01</text>
<text x="54" y="222">Build consistent, well-structured projects</text>
<text x="430" y="222" fill="#ff9a8b" font-size="11" font-weight="700">02</text>
<text x="456" y="222">Expand backend knowledge, APIs and security</text>
<text x="28" y="260" fill="#ff9a8b" font-size="11" font-weight="700">03</text>
<text x="54" y="260">Contribute to open-source software and communities</text>
<text x="430" y="260" fill="#ff9a8b" font-size="11" font-weight="700">04</text>
<text x="456" y="260">Build useful tools and mods for PC games</text>
<text x="28" y="298" fill="#ff9a8b" font-size="11" font-weight="700">05</text>
<text x="54" y="298">Pursue Game Direction, Narrative Direction and Production</text>
</g>
<circle cx="780" cy="190" r="16" fill="#ff2e4d" opacity=".16"/>
<circle cx="780" cy="190" r="6" fill="#ff2e4d"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
</g>
