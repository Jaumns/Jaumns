<svg xmlns="http://www.w3.org/2000/svg" width="408" height="387" viewBox="0 0 408 387" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs></defs><rect x=".5" y=".5" width="407" height="386" rx="10" fill="#150b0e" stroke="#2e1519"/><g font-size="14.5" font-weight="700" fill="#ff2e4d"><text x="18" y="33">CONTROL Resonant — Modding</text><text x="18" y="52">Framework</text></g><rect x="311.0" y="18" width="79.0" height="20" rx="10" fill="#9a969b" fill-opacity=".08" stroke="#9a969b" stroke-opacity=".5"/><text x="350.5" y="32" text-anchor="middle" font-size="10.5" fill="#9a969b">Nexus Mods</text><text x="18" y="76" font-size="12.5" fill="#9a969b">A connected set of projects: CRLooseFiles Loader for</text><text x="18" y="94" font-size="12.5" fill="#9a969b">loose-file and plugin loading, JM Overhaul for visual</text><text x="18" y="112" font-size="12.5" fill="#9a969b">and streaming configuration, and Tweakables for engine</text><text x="18" y="130" font-size="12.5" fill="#9a969b">settings.</text><line x1="18" y1="156" x2="390" y2="156" stroke="#2e1519"/><text x="18" y="178" font-size="10.5" font-weight="800" fill="#f5f2f3" letter-spacing=".6">PROJECT COMPONENTS</text><circle cx="21" cy="198" r="2.6" fill="#ff2e4d"/><text x="34" y="202" font-size="12" fill="#f5f2f3">CRLooseFiles Loader — proxy-DLL framework for external</text><text x="34" y="219" font-size="12" fill="#f5f2f3">files and plugins</text><circle cx="21" cy="239" r="2.6" fill="#ff2e4d"/><text x="34" y="243" font-size="12" fill="#f5f2f3">JM Overhaul — texture streaming, LOD and visual</text><text x="34" y="260" font-size="12" fill="#f5f2f3">configuration</text><circle cx="21" cy="280" r="2.6" fill="#ff2e4d"/><text x="34" y="284" font-size="12" fill="#f5f2f3">Tweakables — engine settings and VRAM-oriented</text><text x="34" y="301" font-size="12" fill="#f5f2f3">profiles</text><line x1="18" y1="341" x2="390" y2="341" stroke="#2e1519"/><circle cx="22" cy="365" r="4.5" fill="#ff2e4d"/><text x="34" y="369" font-size="11.5" fill="#f5f2f3">C++ / XML / INI</text><text x="390" y="361" text-anchor="end" font-size="11" font-weight="700" fill="#f5f2f3">CRLooseFiles  ·  JM Overhaul</text><text x="390" y="375" text-anchor="end" font-size="11" font-weight="700" fill="#f5f2f3">Tweakables</text><g id="pool-motion" fill="none" stroke-linecap="round" pointer-events="none" opacity=".22"><rect width="408.0" height="387.0" fill="#5e0d1c" opacity=".08"/><path d="M-30 131.6 C73.4 119.6 130.6 143.6 204.0 128.6 S334.6 117.2 438.0 135.6" stroke="#ff5366" stroke-width="2.00"><animateTransform attributeName="transform" type="translate" values="0 0; -24 3; 0 0" dur="7s" repeatCount="indefinite"/></path><path d="M-30 220.6 C73.4 204.6 130.6 236.6 204.0 217.6 S334.6 201.4 438.0 224.6" stroke="#ff9a8b" stroke-width="1.65"><animateTransform attributeName="transform" type="translate" values="0 0; 30 1; 0 0" dur="5.5s" repeatCount="indefinite"/></path><path d="M-30 294.1 C73.4 274.1 130.6 314.1 204.0 291.1 S334.6 270.1 438.0 298.1" stroke="#ffd36a" stroke-width="1.30"><animateTransform attributeName="transform" type="translate" values="0 0; -15 -1; 0 0" dur="4.2s" repeatCount="indefinite"/></path></g><g id="glass-panel" pointer-events="none"><rect x="1" y="1" width="406.0" height="385.0" rx="10" fill="#ff2e4d" opacity=".045" stroke="#ff9a8b" stroke-opacity=".28"/><path d="M18 18H390.0" stroke="#ff9a8b" stroke-opacity=".16"/></g></svg>