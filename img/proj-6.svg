re streaming, LOD and visual</text><text x="34" y="242" font-size="12" fill="#f5f2f3">configuration</text></g><g class="a" style="animation-delay:0.46s"><circle cx="21" cy="262" r="2.6" fill="#ff2e4d"/><text x="34" y="266" font-size="12" fill="#f5f2f3">Tweakables — engine settings and VRAM-oriented</text><text x="34" y="283" font-size="12" fill="#f5f2f3">profiles</text></g><g class="a" style="animation-delay:.75s"><line x1="18" y1="341" x2="390" y2="341" stroke="#2e1519"/><circle cx="22" cy="365" r="4.5" fill="#ff2e4d"/><text x="34" y="369" font-size="11.5" fill="#f5f2f3">C++ / XML / INI</text><text x="390" y="369" text-anchor="end" font-size="11.5" font-weight="700" fill="#e8963a">↗  View on Nexus Mods</text></g></svg>