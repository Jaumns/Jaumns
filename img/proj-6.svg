<svg xmlns="http://www.w3.org/2000/svg" width="408" height="387" viewBox="0 0 408 387" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs></defs><rect x=".5" y=".5" width="407" height="386" rx="10" fill="#150b0e" stroke="#2e1519"/><g font-size="14.5" font-weight="700" fill="#ff2e4d"><text x="18" y="33">CONTROL Resonant — Modding</text><text x="18" y="52">Framework</text></g><rect x="311.0" y="18" width="79.0" height="20" rx="10" fill="#9a969b" fill-opacity=".08" stroke="#9a969b" stroke-opacity=".5"/><text x="350.5" y="32" text-anchor="middle" font-size="10.5" fill="#9a969b">Nexus Mods</text><text x="18" y="76" font-size="12.5" fill="#9a969b">A connected set of projects: CRLooseFiles Loader,</text><text x="18" y="94" font-size="12.5" fill="#9a969b">JM Overhaul for visual and streaming configuration,</text><text x="18" y="112" font-size="12.5" fill="#9a969b">and Tweakables for engine settings.</text><line x1="18" y1="138" x2="390" y2="138" stroke="#2e1519"/><text x="18" y="160" font-size="10.5" font-weight="800" fill="#f5f2f3" letter-spacing=".6">PROJECT COMPONENTS</text><circle cx="21" cy="180" r="2.6" fill="#ff2e4d"/><text x="34" y="184" font-size="12" fill="#f5f2f3">CRLooseFiles Loader — proxy-DLL framework for external</text><text x="34" y="201" font-size="12" fill="#f5f2f3">files and plugins</text><circle cx="21" cy="221" r="2.6" fill="#ff2e4d"/><text x="34" y="225" font-size="12" fill="#f5f2f3">JM Overhaul — texture streaming, LOD and visual</text><text x="34" y="242" font-size="12" fill="#f5f2f3">configuration</text><circle cx="21" cy="262" r="2.6" fill="#ff2e4d"/><text x="34" y="266" font-size="12" fill="#f5f2f3">Tweakables — engine settings and VRAM-oriented</text><text x="34" y="283" font-size="12" fill="#f5f2f3">profiles</text><line x1="18" y1="341" x2="390" y2="341" stroke="#2e1519"/><circle cx="22" cy="365" r="4.5" fill="#ff2e4d"/><text x="34" y="369" font-size="11.5" fill="#f5f2f3">C++ / XML / INI</text><text x="390" y="369" text-anchor="end" font-size="11.5" font-weight="700" fill="#f5f2f3">Loader · Overhaul · Tweakables</text><g id="glass-panel" pointer-events="none"><rect x="1" y="1" width="406" height="385" rx="10" fill="#ff2e4d" opacity=".045" stroke="#ff9a8b" stroke-opacity=".28"/></g></svg>