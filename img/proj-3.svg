<svg xmlns="http://www.w3.org/2000/svg" width="408" height="360" viewBox="0 0 408 360" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><style>
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sweep{0%{transform:translateX(-140px)}60%,100%{transform:translateX(440px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes glow{0%,100%{opacity:.0}50%{opacity:.55}}
.a{animation:up .6s ease both}
.sw{animation:sweep 5s ease-in-out infinite}
.pl{animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><clipPath id="c"><rect x=".5" y=".5" width="407" height="359" rx="10"/></clipPath><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#e8963a" stop-opacity="0"/><stop offset=".5" stop-color="#e8963a" stop-opacity=".9"/><stop offset="1" stop-color="#e8963a" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="407" height="359" rx="10" fill="#150b0e" stroke="#2e1519"/><rect x="1" y="1" width="406" height="358" rx="10" fill="#ff2e4d" opacity=".04"/><g clip-path="url(#c)"><rect class="sw" x="0" y="0" width="140" height="2" fill="url(#g)"/></g><g class="a" style="animation-delay:.05s"><g font-size="14.5" font-weight="700" fill="#ff2e4d"><text x="18" y="33">The Sinking City 2 —</text><text x="18" y="52">JM Overhaul</text></g><rect x="273.2" y="18" width="116.8" height="20" rx="10" fill="#e8963a" fill-opacity=".10" stroke="#e8963a" stroke-opacity=".65"/><text x="331.6" y="32" text-anchor="middle" font-size="10.5" font-weight="600" fill="#e8963a">Nexus Mods · New</text></g><g class="a" style="animation-delay:.15s"><text x="18" y="76" font-size="12.5" fill="#9a969b">A graphics overhaul focused on reducing shimmering and</text><text x="18" y="94" font-size="12.5" fill="#9a969b">improving visual stability, while preserving the</text><text x="18" y="112" font-size="12.5" fill="#9a969b">intended visual direction of The Sinking City 2.</text><line x1="18" y1="138" x2="390" y2="138" stroke="#2e1519"/><text x="18" y="160" font-size="10.5" font-weight="800" fill="#f5f2f3" letter-spacing=".6">KEY FEATURES</text></g><g class="a" style="animation-delay:0.30s"><circle cx="21" cy="180" r="2.6" fill="#ff2e4d"/><text x="34" y="184" font-size="12" fill="#f5f2f3">Lumen Hardware Ray Tracing tweaks</text></g><g class="a" style="animation-delay:0.38s"><circle cx="21" cy="204" r="2.6" fill="#ff2e4d"/><text x="34" y="208" font-size="12" fill="#f5f2f3">Significantly reduced shimmering and flickering</text></g><g class="a" style="animation-delay:0.46s"><circle cx="21" cy="228" r="2.6" fill="#ff2e4d"/><text x="34" y="232" font-size="12" fill="#f5f2f3">VRAM-based profiles for 4GB / 6GB / 8GB+ GPUs</text></g><g class="a" style="animation-delay:0.54s"><circle cx="21" cy="252" r="2.6" fill="#ff2e4d"/><text x="34" y="256" font-size="12" fill="#f5f2f3">More stable shadows with tuned Virtual Shadow Maps</text></g><g class="a" style="animation-delay:0.62s"><circle cx="21" cy="276" r="2.6" fill="#ff2e4d"/><text x="34" y="280" font-size="12" fill="#f5f2f3">DLSS and Frame Generation compatibility tweaks</text></g><g class="a" style="animation-delay:.75s"><line x1="18" y1="314" x2="390" y2="314" stroke="#2e1519"/><circle cx="22" cy="338" r="4.5" fill="#ff2e4d"/><text x="34" y="342" font-size="11.5" fill="#f5f2f3">UE5 / INI</text><text x="390" y="342" text-anchor="end" font-size="11.5" font-weight="700" fill="#e8963a">↗  View on Nexus Mods</text></g></svg>