<svg xmlns="http://www.w3.org/2000/svg" width="408" height="360" viewBox="0 0 408 360" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs></defs><rect x=".5" y=".5" width="407" height="359" rx="10" fill="#150b0e" stroke="#2e1519"/><g font-size="14.5" font-weight="700" fill="#ff2e4d"><text x="18" y="33">The Sinking City 2 — JM</text><text x="18" y="52">Overhaul</text></g><rect x="304.9" y="18" width="85.1" height="20" rx="10" fill="#9a969b" fill-opacity=".08" stroke="#9a969b" stroke-opacity=".5"/><text x="347.45" y="32" text-anchor="middle" font-size="10.5" fill="#9a969b">Nexus · New</text><text x="18" y="76" font-size="12.5" fill="#9a969b">A graphics overhaul focused on reducing shimmering and</text><text x="18" y="94" font-size="12.5" fill="#9a969b">improving visual stability, while preserving the</text><text x="18" y="112" font-size="12.5" fill="#9a969b">intended visual direction of The Sinking City 2.</text><line x1="18" y1="138" x2="390" y2="138" stroke="#2e1519"/><text x="18" y="160" font-size="10.5" font-weight="800" fill="#f5f2f3" letter-spacing=".6">KEY FEATURES</text><circle cx="21" cy="180" r="2.6" fill="#ff2e4d"/><text x="34" y="184" font-size="12" fill="#f5f2f3">Lumen Hardware Ray Tracing tweaks</text><circle cx="21" cy="204" r="2.6" fill="#ff2e4d"/><text x="34" y="208" font-size="12" fill="#f5f2f3">Significantly reduced shimmering and flickering</text><circle cx="21" cy="228" r="2.6" fill="#ff2e4d"/><text x="34" y="232" font-size="12" fill="#f5f2f3">VRAM-based profiles for 4GB / 6GB / 8GB+ GPUs</text><circle cx="21" cy="252" r="2.6" fill="#ff2e4d"/><text x="34" y="256" font-size="12" fill="#f5f2f3">More stable shadows with tuned Virtual Shadow Maps</text><circle cx="21" cy="276" r="2.6" fill="#ff2e4d"/><text x="34" y="280" font-size="12" fill="#f5f2f3">DLSS and Frame Generation compatibility tweaks</text><line x1="18" y1="314" x2="390" y2="314" stroke="#2e1519"/><circle cx="22" cy="338" r="4.5" fill="#ff2e4d"/><text x="34" y="342" font-size="11.5" fill="#f5f2f3">UE5 / INI</text><text x="390" y="342" text-anchor="end" font-size="11.5" font-weight="700" fill="#f5f2f3">↗  View on Nexus Mods</text><g id="pool-motion" fill="none" stroke="#ff5366" stroke-linecap="round" pointer-events="none" opacity=".16">
