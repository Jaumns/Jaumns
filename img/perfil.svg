<svg xmlns="http://www.w3.org/2000/svg" width="830" height="323" viewBox="0 0 830 323" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs></defs><rect width="830" height="323" fill="#0b0709"/><rect width="830" height="323" fill="#ff2e4d" fill-opacity=".03"/><rect width="2" height="323" fill="#ff2e4d"/><text x="18" y="34" font-size="14.5" fill="#f5f2f3">I am currently pursuing a Bachelor's degree in Software Engineering at UNILASALLE, in Canoas,</text><text x="18" y="57" font-size="14.5" fill="#f5f2f3">building a solid foundation in software engineering, algorithms, programming and software</text><text x="18" y="80" font-size="14.5" fill="#f5f2f3">architecture.</text><text x="18" y="117" font-size="14.5" fill="#f5f2f3">Alongside my studies, I develop and maintain game modifications that improve performance,</text><text x="18" y="140" font-size="14.5" fill="#f5f2f3">graphics, compatibility and the overall player experience. I also build Helyx, a personal</text><text x="18" y="163" font-size="14.5" fill="#f5f2f3">desktop app created solo from scratch. My work combines software development, reverse</text><text x="18" y="186" font-size="14.5" fill="#f5f2f3">engineering, engine configuration, automation, installer development, technical documentation</text><text x="18" y="209" font-size="14.5" fill="#f5f2f3">and long-term project maintenance.</text><text x="18" y="246" font-size="14.5" fill="#f5f2f3">These projects also helped define the direction I want to follow professionally: the games</text><text x="18" y="269" font-size="14.5" fill="#f5f2f3">industry, combining technical knowledge with narrative, creative direction, production and a</text><text x="18" y="292" font-size="14.5" fill="#f5f2f3">player-centered vision.</text><g id="pool-motion" fill="none" stroke-linecap="round" pointer-events="none" opacity=".22"><rect width="830.0" height="323.0" fill="#5e0d1c" opacity=".08"/><path d="M-30 109.8 C149.4 97.8 265.6 121.8 415.0 106.8 S680.6 95.4 860.0 113.8" stroke="#ff5366" stroke-width="2.00"><animateTransform attributeName="transform" type="translate" values="0 0; -24 3; 0 0" dur="7s" repeatCount="indefinite"/></path><path d="M-30 184.1 C149.4 168.1 265.6 200.1 415.0 181.1 S680.6 164.9 860.0 188.1" stroke="#ff9a8b" stroke-width="1.65"><animateTransform attributeName="transform" type="translate" values="0 0; 30 1; 0 0" dur="5.5s" repeatCount="indefinite"/></path><path d="M-30 245.5 C149.4 225.5 265.6 265.5 415.0 242.5 S680.6 221.5 860.0 249.5" stroke="#ffd36a" stroke-width="1.30"><animateTransform attributeName="transform" type="translate" values="0 0; -15 -1; 0 0" dur="4.2s" repeatCount="indefinite"/></path></g><g id="glass-panel" pointer-events="none"><rect x="1" y="1" width="828.0" height="321.0" rx="10" fill="#ff2e4d" opacity=".045" stroke="#ff9a8b" stroke-opacity=".28"/><path d="M18 18H812.0" stroke="#ff9a8b" stroke-opacity=".16"/></g></svg>