<g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<text x="28" y="42" fill="#ff2e4d" font-size="11" font-weight="700" letter-spacing="2">PROFILE / BACKGROUND</text>
<text x="28" y="82" fill="#f5f2f3" font-size="24" font-weight="700">Engineering with a creative direction.</text>
<text x="28" y="112" fill="#9a969b" font-size="13">I am pursuing a Bachelor's degree in Software Engineering at UNILASALLE, while developing</text>
