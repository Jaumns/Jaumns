<svg xmlns="http://www.w3.org/2000/svg" width="830" height="323" viewBox="0 0 830 323" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs></defs><rect width="830" height="323" fill="#0b0709"/><rect width="830" height="323" fill="#ff2e4d" fill-opacity=".03"/><rect width="2" height="323" fill="#ff2e4d"/><text x="18" y="34" font-size="14.5" fill="#f5f2f3">I am currently pursuing a Bachelor's degree in Software Engineering at UNILASALLE, in Canoas,</text><text x="18" y="57" font-size="14.5" fill="#f5f2f3">building a solid foundation in software engineering, algorithms, programming and software</text><text x="18" y="80" font-size="14.5" fill="#f5f2f3">architecture.</text><text x="18" y="117" font-size="14.5" fill="#f5f2f3">Alongside my studies, I develop and maintain game modifications that improve performance,</text><text x="18" y="140" font-size="14.5" fill="#f5f2f3">graphics, compatibility and the overall player experience. I also build Helyx, a personal</text><text x="18" y="163" font-size="14.5" fill="#f5f2f3">desktop app created solo from scratch. My work combines software development, reverse</text><text x="18" y="186" font-size="14.5" fill="#f5f2f3">engineering, engine configuration, automation, installer development, technical documentation</text><text x="18" y="209" font-size="14.5" fill="#f5f2f3">and long-term project maintenance.</text><text x="18" y="246" font-size="14.5" fill="#f5f2f3">These projects also helped define the direction I want to follow professionally: the games</text><text x="18" y="269" font-size="14.5" fill="#f5f2f3">industry, combining technical knowledge with narrative, creative direction, production and a</text><text x="18" y="292" font-size="14.5" fill="#f5f2f3">player-centered vision.</text><g id="pool-motion" fill="none" stroke="#ff5366" stroke-linecap="round" pointer-events="none" opacity=".16">
