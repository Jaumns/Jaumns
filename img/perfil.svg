<text x="260" y="216" fill="#f5f2f3" font-size="15" font-weight="600">Game Modding</text>
<text x="438" y="216" fill="#f5f2f3" font-size="15" font-weight="600">Tools &amp; Experiences</text>
<circle cx="780" cy="204" r="16" fill="#ff2e4d" opacity=".16"/>
<circle cx="780" cy="204" r="6" fill="#ff2e4d"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
</g>
<g id="glass-panel" pointer-events="none"><rect x="1" y="1" width="828" height="248" rx="10" fill="#ff2e4d" opacity=".045" stroke="#ff9a8b" stroke-opacity=".28"/></g>
