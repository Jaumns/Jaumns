<svg xmlns="http://www.w3.org/2000/svg" width="408" height="360" viewBox="0 0 408 360" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><defs></defs><rect x=".5" y=".5" width="407" height="359" rx="10" fill="#150b0e" stroke="#2e1519"/><g font-size="14.5" font-weight="700" fill="#ff2e4d"><text x="18" y="33">Helyx</text></g><rect x="243.9" y="18" width="146.1" height="20" rx="10" fill="#ff2e4d" fill-opacity=".08" stroke="#ff2e4d" stroke-opacity=".5"/><text x="316.95" y="32" text-anchor="middle" font-size="10.5" fill="#ff2e4d">Solo · In development</text><text x="18" y="57" font-size="12.5" fill="#9a969b">A personal desktop app built solo from scratch,</text><text x="18" y="75" font-size="12.5" fill="#9a969b">combining productivity tools with its own interface and</text><text x="18" y="93" font-size="12.5" fill="#9a969b">an evolving redesign.</text><line x1="18" y1="119" x2="390" y2="119" stroke="#2e1519"/><text x="18" y="141" font-size="10.5" font-weight="800" fill="#f5f2f3" letter-spacing=".6">KEY FEATURES</text><circle cx="21" cy="161" r="2.6" fill="#ff2e4d"/><text x="34" y="165" font-size="12" fill="#f5f2f3">Built with Electron, React, Vite and tRPC</text><circle cx="21" cy="185" r="2.6" fill="#ff2e4d"/><text x="34" y="189" font-size="12" fill="#f5f2f3">Custom UI system and visual redesign</text><circle cx="21" cy="209" r="2.6" fill="#ff2e4d"/><text x="34" y="213" font-size="12" fill="#f5f2f3">Spotify integration and playback controls</text><circle cx="21" cy="233" r="2.6" fill="#ff2e4d"/><text x="34" y="237" font-size="12" fill="#f5f2f3">Developed solo through continuous iteration</text><line x1="18" y1="314" x2="390" y2="314" stroke="#2e1519"/><circle cx="22" cy="338" r="4.5" fill="#35d0ff"/><text x="34" y="342" font-size="11.5" fill="#f5f2f3">Electron / React / tRPC</text><text x="390" y="342" text-anchor="end" font-size="11.5" font-style="italic" fill="#615c62">Solo personal project</text><g id="pool-motion" fill="none" stroke="#ff5366" stroke-linecap="round" pointer-events="none" opacity=".16">
