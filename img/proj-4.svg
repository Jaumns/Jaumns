<svg xmlns="http://www.w3.org/2000/svg" width="408" height="360" viewBox="0 0 408 360" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"><style>
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sweep{0%{transform:translateX(-140px)}60%,100%{transform:translateX(440px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes glow{0%,100%{opacity:.0}50%{opacity:.55}}
.a{animation:up .6s ease both}
.sw{animation:sweep 5s ease-in-out infinite}
.pl{animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><clipPath id="c"><rect x=".5" y=".5" width="407" height="359" rx="10"/></clipPath><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff2e4d" stop-opacity="0"/><stop offset=".5" stop-color="#ff2e4d" stop-opacity=".9"/><stop offset="1" stop-color="#ff2e4d" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="407" height="359" rx="10" fill="#150b0e" stroke="#2e1519"/><rect x="1" y="1" width="406" height="358" rx="10" fill="#ff2e4d" opacity=".04"/><g clip-path="url(#c)"><rect class="sw" x="0" y="0" width="140" height="2" fill="url(#g)"/></g><g class="a" style="animation-delay:.05s"><g font-size="14.5" font-weight="700" fill="#ff2e4d"><text x="18" y="33">Helyx —</text><text x="18" y="52">Personal Desktop App</text></g><rect x="229.7" y="18" width="160.3" height="20" rx="10" fill="#ff2e4d" fill-opacity=".10" stroke="#ff2e4d" stroke-opacity=".65"/><text x="315.9" y="32" text-anchor="middle" font-size="10.5" font-weight="600" fill="#ff2e4d">Solo · In development</text><circle class="pl" cx="240.7" cy="28" r="2.6" fill="#ff2e4d"/></g><g class="a" style="animation-delay:.15s"><text x="18" y="76" font-size="12.5" fill="#9a969b">A personal desktop app built solo from scratch,</text><text x="18" y="94" font-size="12.5" fill="#9a969b">combining productivity tools with its own interface and</text><text x="18" y="112" font-size="12.5" fill="#9a969b">an evolving redesign.</text><line x1="18" y1="138" x2="390" y2="138" stroke="#2e1519"/><text x="18" y="160" font-size="10.5" font-weight="800" fill="#f5f2f3" letter-spacing=".6">KEY FEATURES</text></g><g class="a" style="animation-delay:0.30s"><circle cx="21" cy="180" r="2.6" fill="#ff2e4d"/><text x="34" y="184" font-size="12" fill="#f5f2f3">Built with Electron, React, Vite and tRPC</text></g><g class="a" style="animation-delay:0.38s"><circle cx="21" cy="204" r="2.6" fill="#ff2e4d"/><text x="34" y="208" font-size="12" fill="#f5f2f3">Custom UI system and visual redesign</text></g><g class="a" style="animation-delay:0.46s"><circle cx="21" cy="228" r="2.6" fill="#ff2e4d"/><text x="34" y="232" font-size="12" fill="#f5f2f3">Spotify integration and playback controls</text></g><g class="a" style="animation-delay:0.54s"><circle cx="21" cy="252" r="2.6" fill="#ff2e4d"/><text x="34" y="256" font-size="12" fill="#f5f2f3">Developed solo through continuous iteration</text></g><g class="a" style="animation-delay:.75s"><line x1="18" y1="314" x2="390" y2="314" stroke="#2e1519"/><circle cx="22" cy="338" r="4.5" fill="#35d0ff"/><text x="34" y="342" font-size="11.5" fill="#f5f2f3">Electron / React / tRPC</text><text x="390" y="342" text-anchor="end" font-size="11.5" font-style="italic" fill="#615c62">Solo personal project</text></g></svg>